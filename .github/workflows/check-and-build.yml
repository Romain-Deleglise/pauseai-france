name: pnpm check and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pnpm-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          # Nouveauté de setup-node v5 : `package-manager-cache` vaut true par
          # défaut et active le cache dès que package.json porte un champ
          # `packageManager` — ici pnpm. L'action cherche alors l'exécutable
          # `pnpm` AVANT l'étape « Enable Corepack » qui l'installe, et échoue
          # sur « Unable to locate executable file: pnpm ». On rétablit le
          # comportement de la v4.
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Copy env file
        run: cp template.env .env

      - name: Run pnpm check
        run: pnpm check

      - name: Run pnpm build
        run: pnpm build
